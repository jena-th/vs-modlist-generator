name: Release

on:
  push:
    tags:
      - 'v*'   # matches v1.0.0, v2.3.4-beta, etc.

permissions:
  contents: write   # required to create the GitHub release

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build all targets
        run: bash build.sh

      - name: Create release and upload artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh is pre-installed on GitHub Actions runners. Creates a
          # release tagged with the same name, auto-generates a changelog
          # from commits since the last tag; uploads everything under
          # builds/.
          gh release create "$GITHUB_REF_NAME" \
            --title "Release ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            builds/*
